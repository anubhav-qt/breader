<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Not found · Breader</title>
    <!-- Cloudflare Pages answers every address it has no file for with this page and a 404, so
         search engines don't keep made-up addresses as copies of the app. -->
    <style>
      :root { --canvas: #fff; --ink: #000; --ink-2: #6b6b6b; }
      @media (prefers-color-scheme: dark) {
        :root { --canvas: #000; --ink: #fff; --ink-2: #999; }
      }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--ink);
        font: 400 17px/1.6 Georgia, serif;
      }
      main { max-width: 640px; margin: 0 auto; padding: 48px 16px 80px; }
      h1 { font-size: 32px; line-height: 1.2; margin: 0 0 8px; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <main>
      <h1>Not found</h1>
      <p><a href="/">Open Breader</a></p>
    </main>
  </body>
</html>
