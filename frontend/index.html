<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <!-- Added to a phone's Home Screen, Breader opens as an app, without the browser's bars. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Breader" />
    <title>Breader</title>
    <!-- What search engines and link previews show; written from what the empty library says. -->
    <meta name="description" content="A free e-reader in the browser. Read EPUB, PDF, TXT, Markdown and CBZ in the look you like, hear sixty voices read aloud, make any book into an MP3 audiobook, and share with people you trust." />
    <link rel="canonical" href="https://breader.site/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Breader" />
    <meta property="og:url" content="https://breader.site/" />
    <meta property="og:title" content="Breader" />
    <meta property="og:description" content="A free e-reader in the browser. Read EPUB, PDF, TXT, Markdown and CBZ in the look you like, hear sixty voices read aloud, make any book into an MP3 audiobook, and share with people you trust." />
    <meta property="og:image" content="https://breader.site/icon-512.png" />
    <meta property="og:image:alt" content="Breader" />
    <meta name="twitter:card" content="summary" />
    <!-- Proves to Google Search Console that breader.site is ours. Keep it: Google checks it again. -->
    <meta name="google-site-verification" content="zKlPGbwGdknb6y-z_4KmPNR6XWhsMWmAchUxQaouB00" />
    <script type="application/ld+json">
      { "@context": "https://schema.org", "@type": "WebSite", "name": "Breader", "url": "https://breader.site/" }
    </script>
    <!-- Light or dark as last picked with the sun-or-moon button (App.tsx), before anything is drawn. -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('breader.theme.v1'));
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t;
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = t === 'dark' ? '#000000' : '#FFFFFF'; });
        }
      } catch (e) { /* storage blocked: the device's */ }
    </script>
    <!-- The typefaces, declared in src/styles/fonts.css: most from Google Fonts, and the card faces
         from our own files, preloaded so the library is laid out once, in them. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/src/styles/fonts/Doto-800.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/src/styles/fonts/Doto-900.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/src/styles/fonts/Dongle-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/src/styles/fonts/Dongle-700.woff2" crossorigin />
  </head>
  <body>
    <!-- The empty library's words (features/guide/Welcome.tsx), so crawlers that run no script read
         what Breader is. The app draws over it as it starts. -->
    <div id="root">
      <div class="lib">
        <main class="gallery is-empty">
          <div class="wl">
            <h1 class="wl-h">Start with a book</h1>
            <ul class="wl-cards">
              <li><div class="wl-card"><b>Read</b><span>EPUB, PDF, TXT, Markdown and CBZ, in the look you like.</span></div></li>
              <li><div class="wl-card"><b>Listen</b><span>Sixty voices read aloud, or the words light up as you read.</span></div></li>
              <li><div class="wl-card"><b>Audiobooks</b><span>Any book made into MP3, to play with the screen off.</span></div></li>
              <li><div class="wl-card"><b>Share</b><span>Your key lets the people you trust read what you share.</span></div></li>
            </ul>
            <a class="wl-guide" href="/privacy">Privacy</a>
          </div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
