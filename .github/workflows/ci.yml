# Every push and pull request: type checks, lint, the server tests against the local stand-ins.
# Pushes to dev then publish the server image (arm64 for the Mac, amd64 for Render), migrate
# Supabase, and redeploy Render. The laptop picks the image up itself (infra/update.sh), and
# Cloudflare Pages builds the app from the same commit.
#
# Repository secrets: SUPABASE_SESSION_URL (session pooler URL) and RENDER_DEPLOY_HOOK. Without
# them the deploy steps are skipped.
name: ci

on:
  push: { branches: [dev] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version-file: server/.nvmrc, cache: npm }
      # The same Postgres and S3 stand-ins as local development, with the same throwaway settings.
      - name: Start the stand-ins
        run: |
          docker compose -f infra/compose.dev.yml up -d --wait primary mirror s3
          timeout 60 sh -c 'until curl -s -o /dev/null http://localhost:9000; do sleep 1; done'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -w frontend
      - run: npm test

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read, packages: write }
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      # The panel model (server/src/panels/) is in Git LFS, whose downloads are metered: it's
      # fetched once per round and cached by its hash, which its pointer file names.
      - id: model
        run: echo "oid=$(sed -n 's/^oid sha256://p' ai/panels/model/live.onnx)" >> "$GITHUB_OUTPUT"
      - id: model-cache
        uses: actions/cache@v4
        with: { path: .panel-model, key: "panel-model-${{ steps.model.outputs.oid }}" }
      - if: steps.model-cache.outputs.cache-hit != 'true'
        run: git lfs pull --include ai/panels/model/live.onnx && mkdir -p .panel-model && cp ai/panels/model/live.onnx .panel-model/
      - run: |
          cp .panel-model/live.onnx ai/panels/model/live.onnx
          test "$(sha256sum < ai/panels/model/live.onnx | cut -d' ' -f1)" = "${{ steps.model.outputs.oid }}"
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/breader-server" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: RELEASE=${{ github.sha }}
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { packages: read }
    env:
      SUPABASE_SESSION_URL: ${{ secrets.SUPABASE_SESSION_URL }}
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      # Migrations only ever add, so the laptop and Render keep working while this runs.
      - name: Migrate Supabase
        if: env.SUPABASE_SESSION_URL != ''
        run: |
          docker run --rm -e PRIMARY_URL="$SUPABASE_SESSION_URL" -e PRIMARY_SSL=require \
            "${{ needs.image.outputs.image }}:${{ github.sha }}" node dist/migrate.js
      # Render pulls :latest, which now points at this commit.
      - name: Redeploy Render
        if: env.RENDER_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
