# Checks every pull request and push to dev: the same commands CONTRIBUTING.md asks you to run.
name: CI

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (typecheck, lint, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -w frontend
      - run: npm test -w frontend

  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Only the stand-ins the tests need: both Postgres servers and the S3 bucket.
      - run: docker compose -f infra/compose.dev.yml up -d --wait primary mirror s3
      - run: npm test -w server
