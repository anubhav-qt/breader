# The laptop in production: the API behind a Cloudflare Tunnel, the worker, and the copy.
# Settings come from infra/.env (copy .env.example; never commit it). See README.md.
#   docker compose -f infra/compose.yml up -d
# Nothing listens on the home network: the tunnel dials out to Cloudflare.
name: breader

x-server: &server
  image: ${IMAGE:?set IMAGE in infra/.env}
  env_file: .env
  restart: unless-stopped
  depends_on:
    migrate: { condition: service_completed_successfully }

x-mirror-url: &mirror-url "postgres://breader:${MIRROR_PASSWORD:?set MIRROR_PASSWORD in infra/.env}@mirror:5432/breader"

services:
  # The laptop's copy of Supabase: answers reads, and is what the nightly backup dumps.
  mirror:
    image: pgvector/pgvector:pg17
    environment: { POSTGRES_USER: breader, POSTGRES_PASSWORD: "${MIRROR_PASSWORD}", POSTGRES_DB: breader }
    volumes: ["mirror:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "breader", "-d", "breader"], interval: 5s, retries: 30 }
    restart: unless-stopped

  # Keeps what MangaDex answered, so a restart doesn't ask again: 256 MB at most, the answers used
  # longest ago going first. Only the API reaches it, and carries on without it. To look inside:
  #   docker compose -f infra/compose.yml exec redis redis-cli
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: ["redis:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 30 }
    restart: unless-stopped

  # Manga sources the API asks for every reader: a Suwayomi server running Mihon's extensions, and a
  # Komga library of comic files (copied into the komga-books volume, at /books). Their web pages
  # answer on this machine only, for setting them up (README.md › Manga): Suwayomi's extensions at
  # http://localhost:4567, and Komga's admin, library and API key (KOMGA_API_KEY) at :25600.
  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:v2.4.2366
    environment:
      EXTENSION_STORES: '["https://raw.githubusercontent.com/keiyoushi/extensions/repo/repo.json"]'
      WEB_UI_CHANNEL: bundled
      WEB_UI_UPDATE_INTERVAL: "0"
      KCEF_ENABLED: "false"
    ports: ["127.0.0.1:4567:4567"]
    volumes: ["suwayomi:/home/suwayomi/.local/share/Tachidesk"]
    restart: unless-stopped

  komga:
    image: gotson/komga:1.28.1
    environment: { JAVA_TOOL_OPTIONS: "-Xmx512m" }
    ports: ["127.0.0.1:25600:25600"]
    volumes: ["komga:/config", "komga-books:/books"]
    restart: unless-stopped

  # Brings Supabase and the copy to the image's schema before the new version starts, then exits.
  migrate:
    <<: *server
    command: ["node", "dist/migrate.js"]
    restart: "no"
    environment:
      PRIMARY_URL: "${PRIMARY_SESSION_URL:?set PRIMARY_SESSION_URL in infra/.env}"
      MIRROR_URL: *mirror-url
    depends_on:
      mirror: { condition: service_healthy }

  api:
    <<: *server
    environment:
      ROLE: laptop
      MIRROR_URL: *mirror-url
      # Every request arrives through the tunnel, and Cloudflare sets this header itself.
      CLIENT_IP_HEADER: cf-connecting-ip
      REDIS_URL: "redis://redis:6379"
    # The server voice's files (SPEECH_EMAILS in .env turns it on), downloaded once, and the manga
    # pages MangaDex sent lately (MANGA_CACHE_MB).
    volumes: ["voices:/data/voices", "manga:/data/manga"]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"], interval: 10s }

  worker:
    <<: *server
    command: ["node", "--enable-source-maps", "dist/worker.js"]
    environment:
      # Long transactions and cursors (the change feed, reloads) need a real session.
      PRIMARY_URL: "${PRIMARY_SESSION_URL}"
      MIRROR_URL: *mirror-url
      # Backups run after 03:00 here.
      TZ: Asia/Kolkata
    volumes: ["files:/data/files", "backups:/data/backups"]

  # api.breader.example → http://api:8787, set on the tunnel's Public Hostname page in Cloudflare.
  tunnel:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run"]
    environment: { TUNNEL_TOKEN: "${TUNNEL_TOKEN:?set TUNNEL_TOKEN in infra/.env}" }
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  mirror: {}
  files: {}
  backups: {}
  voices: {}
  manga: {}
  redis: {}
  suwayomi: {}
  komga: {}
  komga-books: {}
