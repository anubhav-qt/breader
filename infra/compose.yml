# The laptop in production: the API behind a Cloudflare Tunnel, the worker, and the copy.
# Settings come from infra/.env (copy .env.example; never commit it). See README.md.
#   docker compose -f infra/compose.yml up -d
# Nothing listens on the home network: the tunnel dials out to Cloudflare.
name: breader

x-server: &server
  image: ${IMAGE:?set IMAGE in infra/.env}
  env_file: .env
  restart: unless-stopped
  depends_on:
    migrate: { condition: service_completed_successfully }

x-mirror-url: &mirror-url "postgres://breader:${MIRROR_PASSWORD:?set MIRROR_PASSWORD in infra/.env}@mirror:5432/breader"

services:
  # The laptop's copy of Supabase: answers reads, and is what the nightly backup dumps.
  mirror:
    image: pgvector/pgvector:pg17
    environment: { POSTGRES_USER: breader, POSTGRES_PASSWORD: "${MIRROR_PASSWORD}", POSTGRES_DB: breader }
    volumes: ["mirror:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "breader", "-d", "breader"], interval: 5s, retries: 30 }
    restart: unless-stopped

  # Keeps what MangaDex answered, so a restart doesn't ask again: 1 GB at most, the answers used
  # longest ago going first. Only the API reaches it, and carries on without it. To look inside:
  #   docker compose -f infra/compose.yml exec redis redis-cli
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    volumes: ["redis:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 30 }
    restart: unless-stopped

  # Manga sources the API asks for every reader: a Suwayomi server running Mihon's extensions. Its web
  # page answers on this machine only, for installing them (README.md › Manga), at
  # http://localhost:4567.
  suwayomi:
    image: ghcr.io/suwayomi/suwayomi-server:v2.4.2366
    environment:
      EXTENSION_STORES: '["https://raw.githubusercontent.com/keiyoushi/extensions/repo/repo.json"]'
      WEB_UI_CHANNEL: bundled
      WEB_UI_UPDATE_INTERVAL: "0"
      KCEF_ENABLED: "false"
    ports: ["127.0.0.1:4567:4567"]
    volumes: ["suwayomi:/home/suwayomi/.local/share/Tachidesk"]
    restart: unless-stopped

  # The novel sites' plugins (LNReader's), each site's own code, run in a container of their own: no
  # .env, no database, and a network apart that only the API and the worker share with it. Sites
  # behind Cloudflare's check are asked through FlareSolverr, a browser beside it.
  novels:
    image: ${IMAGE}
    command: ["node", "--enable-source-maps", "dist/novels/host.js"]
    environment:
      NOVELS_DIR: /data/novels
      FLARESOLVERR_URL: "http://flaresolverr:8191/v1"
    volumes: ["novels:/data/novels"]
    networks: [novels]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4568/health"], interval: 10s }
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    environment: { LOG_LEVEL: info, TZ: Asia/Kolkata }
    networks: [novels]
    restart: unless-stopped

  # Brings Supabase and the copy to the image's schema before the new version starts, then exits.
  migrate:
    <<: *server
    command: ["node", "dist/migrate.js"]
    restart: "no"
    environment:
      PRIMARY_URL: "${PRIMARY_SESSION_URL:?set PRIMARY_SESSION_URL in infra/.env}"
      MIRROR_URL: *mirror-url
    depends_on:
      mirror: { condition: service_healthy }

  api:
    <<: *server
    environment:
      ROLE: laptop
      MIRROR_URL: *mirror-url
      # Every request arrives through the tunnel, and Cloudflare sets this header itself.
      CLIENT_IP_HEADER: cf-connecting-ip
      REDIS_URL: "redis://redis:6379"
      # A manga search looks in Suwayomi's sources too.
      SUWAYOMI_URL: "http://suwayomi:4567"
      # A book search looks on the novel sites too.
      NOVELS_URL: "http://novels:4568"
    # The server voice's files (SPEECH_EMAILS in .env turns it on), downloaded once, the manga
    # pages MangaDex sent lately (MANGA_CACHE_MB), the books' volumes made lately (BOOKS_CACHE_MB),
    # and every chapter and volume of what's in a library, kept for good.
    volumes: ["voices:/data/voices", "manga:/data/manga", "books:/data/books"]
    networks: [default, novels]
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"], interval: 10s }

  worker:
    <<: *server
    command: ["node", "--enable-source-maps", "dist/worker.js"]
    environment:
      # Long transactions and cursors (the change feed, reloads) need a real session.
      PRIMARY_URL: "${PRIMARY_SESSION_URL}"
      MIRROR_URL: *mirror-url
      # Backups run after 03:00 here.
      TZ: Asia/Kolkata
      # Suwayomi's extensions and the novel sites' plugins are updated once a day.
      SUWAYOMI_URL: "http://suwayomi:4567"
      NOVELS_URL: "http://novels:4568"
    # The AI marker runs inside it too (server/src/jobs/marker.ts), keeping its work in files/ai.
    volumes: ["files:/data/files", "backups:/data/backups"]
    networks: [default, novels]

  # api.breader.example → http://api:8787, set on the tunnel's Public Hostname page in Cloudflare.
  tunnel:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "run"]
    environment: { TUNNEL_TOKEN: "${TUNNEL_TOKEN:?set TUNNEL_TOKEN in infra/.env}" }
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  mirror: {}
  files: {}
  backups: {}
  voices: {}
  manga: {}
  redis: {}
  suwayomi: {}
  books: {}
  novels: {}

networks:
  default: {}
  novels: {}
